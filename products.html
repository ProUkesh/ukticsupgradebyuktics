<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Uktics E-Commerce SaaS Demo</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --primary-color: #00ff00;
            --secondary-color: #ff00ff;
            --card-bg: rgba(255, 255, 255, 0.1);
            --glow: rgba(0, 255, 0, 0.5);
            --hover-glow: rgba(0, 255, 0, 1);
            --border-glow: rgba(0, 255, 0, 0.3);
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            color: var(--text-color);
            overflow-x: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
        }
        nav a {
            color: var(--text-color);
            margin: 0 1rem;
            text-decoration: none;
        }
        .product-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem;
            text-align: center;
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 10px var(--hover-glow);
        }
        .add-to-cart {
            background: var(--primary-color);
            border: none;
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .add-to-cart:hover {
            box-shadow: 0 0 10px var(--hover-glow);
        }
    </style>
</head>
<body>
    <header>
        <div>Uktics</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="checkout.html">Checkout</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
            <a href="pricing.html">Pricing</a>
        </nav>
    </header>
    <main>
        <h1>Product Catalog</h1>
        <div class="product-list">
            <div class="product-card">
                <h2>Product 1</h2>
                <p>Price: $10</p>
                <button class="add-to-cart" data-product-id="1">Add to Cart</button>
            </div>
            <div class="product-card">
                <h2>Product 2</h2>
                <p>Price: $20</p>
                <button class="add-to-cart" data-product-id="2">Add to Cart</button>
            </div>
            <div class="product-card">
                <h2>Product 3</h2>
                <p>Price: $30</p>
                <button class="add-to-cart" data-product-id="3">Add to Cart</button>
            </div>
        </div>
    </main>
    <script>
        const addToCartButtons = document.querySelectorAll('.add-to-cart');
        addToCartButtons.forEach(button => {
            button.addEventListener('click', () => {
                const productId = button.getAttribute('data-product-id');
                let cart = JSON.parse(localStorage.getItem('uktics_demo_cart')) || [];
                cart.push(productId);
                localStorage.setItem('uktics_demo_cart', JSON.stringify(cart));
                alert('Product added to cart!');
            });
        });
    </script>
</body>
</html>
